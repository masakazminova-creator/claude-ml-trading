name: 🚀 Auto Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

  deploy:
    name: 🖥️ Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: success() || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server via SSH
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          set -e

          echo "[Deploy] Navigating to project directory..."
          cd /opt/claude-ml-trading

          # Save deployment info for debugging
          echo "Deployment timestamp: $(date)" > /tmp/deploy_log.txt
          echo "Git commit: $(git rev-parse HEAD)" >> /tmp/deploy_log.txt
          echo "" >> /tmp/deploy_log.txt

          echo "[Deploy] Pulling latest changes..."
          git pull origin main 2>&1 | tee -a /tmp/deploy_log.txt

          echo "[Deploy] Building Docker images..."
          docker-compose build --no-cache 2>&1 | tee -a /tmp/deploy_log.txt

          echo "[Deploy] Starting containers..."
          docker-compose down || true
          docker-compose up -d 2>&1 | tee -a /tmp/deploy_log.txt

          echo "[Deploy] Waiting for services to start..."
          sleep 5

          echo "[Deploy] Checking container status..."
          docker-compose ps 2>&1 | tee -a /tmp/deploy_log.txt

          echo "[Deploy] Restarting ALL services to load new code..."
          docker-compose down 2>&1 | tee -a /tmp/deploy_log.txt
          sleep 5
          docker-compose up -d 2>&1 | tee -a /tmp/deploy_log.txt
          sleep 15

          echo "[Deploy] Verifying all containers are running..."
          docker-compose ps 2>&1 | tee -a /tmp/deploy_log.txt

          echo ""
          echo "[Deploy] === TELEGRAM BOT STATUS ==="
          echo "[Deploy] Checking telegram-bot container..."
          docker-compose ps telegram-bot 2>&1 | tee -a /tmp/deploy_log.txt

          echo ""
          echo "[Deploy] Telegram bot logs (last 50 lines)..."
          docker-compose logs --tail=50 telegram-bot 2>&1 | tee -a /tmp/deploy_log.txt

          echo ""
          echo "[Deploy] Runtime container logs (last 30 lines)..."
          docker-compose logs --tail=30 claude-ml-trading 2>&1 | tee -a /tmp/deploy_log.txt

          echo ""
          echo "[Deploy] Database file check..."
          ls -lh /opt/claude-ml-trading/data/runtime.sqlite 2>&1 | tee -a /tmp/deploy_log.txt
          echo "" >> /tmp/deploy_log.txt

          echo "[Deploy] ✅ Deployment complete!"
          echo "Full deployment log saved to /tmp/deploy_log.txt on server"
        ENDSSH

    - name: Download deployment logs from server
      if: always()
      run: |
        echo "Downloading deployment logs..."
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          cat /tmp/deploy_log.txt 2>/dev/null || echo "Log file not found"
        ENDSSH

    - name: Notify deployment result
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🎉 Deployment successful!"
        else
          echo "❌ Deployment failed! Check logs above for details."
        fi
